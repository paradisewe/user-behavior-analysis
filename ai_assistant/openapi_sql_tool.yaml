openapi: 3.0.3
info:
  title: Taobao SQL Tool
  description: >
    淘宝用户行为数据的只读 SQL 查询工具（DuckDB 全量 1 亿行）。
    表名 user_behavior，GET /schema 可获取字段说明与指标口径。
    仅允许单条 SELECT/WITH 语句，结果自动 LIMIT 500。
  version: "1.0"
servers:
  - url: http://host.docker.internal:5057
paths:
  /query:
    post:
      operationId: query_sql
      summary: 执行只读 SQL 查询并返回结果
      description: 传入一条 SELECT/WITH 语句，返回列名、数据行、耗时。按天聚合用 behavior_date 列。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:
                  type: string
                  description: 单条 SELECT 或 WITH 查询。例如 SELECT behavior_date, COUNT(DISTINCT user_id) AS dau FROM user_behavior GROUP BY 1 ORDER BY 1
                  example: SELECT behavior_date, COUNT(DISTINCT user_id) AS dau FROM user_behavior GROUP BY 1 ORDER BY 1
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items: { type: string }
                  rows:
                    type: array
                    items: { type: array }
                  row_count: { type: integer }
                  truncated: { type: boolean }
                  elapsed_ms: { type: integer }
                  executed_sql: { type: string }
        "400":
          description: SQL 未通过安全守卫
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
  /schema:
    get:
      operationId: get_schema
      summary: 获取表结构、字段说明与常用指标口径
      responses:
        "200":
          description: 表结构信息
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      operationId: health_check
      summary: 服务存活检查
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
